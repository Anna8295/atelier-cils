name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push and pull request runs lint, the unit/component tests and the
  # end-to-end + accessibility tests on desktop and phone.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Unit and component tests (Vitest)
        run: npm run test:coverage
      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests (Playwright)
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
